<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ygrsapswrriwvygjkdcz.supabase.co; base-uri 'self'; form-action 'self';">
<title>Nouveau mot de passe — CEH13 Trainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand" style="margin-bottom: 24px; text-align:center;">CEH13<span>_trainer</span></div>
    <h2 style="margin-bottom:16px;">Choisis un nouveau mot de passe</h2>
    <form id="reset-form">
      <label>Nouveau mot de passe
        <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
      </label>
      <div id="reset-error" class="auth-error" style="display:none;"></div>
      <div id="reset-success" class="auth-success" style="display:none;"></div>
      <button type="submit" class="btn" id="reset-submit-btn" style="width:100%;">Enregistrer le nouveau mot de passe</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
