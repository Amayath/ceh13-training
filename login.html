<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ygrsapswrriwvygjkdcz.supabase.co; base-uri 'self'; form-action 'self';">
<title>Connexion — CEH13 Trainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand" style="margin-bottom: 24px; text-align:center;">CEH13<span>_trainer</span></div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Connexion</button>
      <button type="button" class="auth-tab" id="tab-signup">Créer un compte</button>
    </div>
    <form id="auth-form">
      <label>Email
        <input type="email" id="email" autocomplete="email" required>
      </label>
      <label id="password-field">Mot de passe
        <input type="password" id="password" autocomplete="current-password" minlength="8" required>
      </label>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
      <div id="auth-success" class="auth-success" style="display:none;"></div>
      <button type="submit" class="btn" id="submit-btn" style="width:100%;">Se connecter</button>
    </form>
    <div class="auth-links">
      <a href="#" id="forgot-toggle">Mot de passe oublié ?</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/login.js"></script>
</body>
</html>
