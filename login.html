<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — CEH13 Trainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand" style="margin-bottom: 24px; text-align:center;">CEH13<span>_trainer</span></div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Connexion</button>
      <button type="button" class="auth-tab" id="tab-signup">Créer un compte</button>
    </div>
    <form id="auth-form">
      <label>Email
        <input type="email" id="email" autocomplete="email" required>
      </label>
      <label>Mot de passe
        <input type="password" id="password" autocomplete="current-password" minlength="6" required>
      </label>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
      <button type="submit" class="btn" id="submit-btn" style="width:100%;">Se connecter</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/login.js"></script>
</body>
</html>
